<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner"><p class="kicker">Changelog & news</p><h1>Blog & updates</h1>
    <p class="lead">AI security news roundup and academy updates.</p></div>
  </header>
  <main id="main">
    <section class="section" id="blogList"></section>
    <section class="section">
      <h2>Subscribe (local reminder)</h2>
      <form id="newsletterForm" class="alert alert-info" style="max-width:400px">
        <label>Email <input name="email" type="email" required placeholder="you@example.com" style="width:100%;padding:0.5rem;margin-top:0.35rem;border-radius:6px;border:1px solid var(--border)" /></label>
        <button class="btn btn-primary" type="submit" style="margin-top:0.75rem">Subscribe on this device</button>
      </form>
      <button class="btn btn-secondary" id="enableReminder" type="button" style="margin-top:1rem">Enable daily study notification</button>
    </section>
    <section class="section">
      <h2>Submit a case study</h2>
      <p><a href="submit.html">Contribute a local submission →</a></p>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script><script src="site-data-extra.js"></script><script src="site-data-v3.js"></script><script src="site-data-v4.js"></script><script src="site-data-v5.js"></script><script src="app.js"></script><script src="features.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.getElementById("blogList").innerHTML = BLOG_POSTS.map(b => `
      <article class="glossary-item case-card">
        <span class="tag">${b.date}</span>
        ${b.tags.map(t => `<span class="tag">${t}</span>`).join("")}
        <h3>${b.title}</h3>
        <p>${b.summary}</p>
      </article>`).join("");
    document.addEventListener("DOMContentLoaded", () => {
      AcademyFeatures.initNewsletter("newsletterForm");
      AcademyFeatures.initReminder();
    });
  </script>
</body>
</html>
