<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certifications — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner">
      <p class="kicker">Certification guide</p>
      <h1>Certifications</h1>
      <p class="lead">Which cert to pursue based on your background — and when to skip them entirely.</p>
    </div>
  </header>
  <main id="main">
    <section class="section">
      <div class="section-header"><h2>Decision guide</h2></div>
      <div id="certTree"></div>
    </section>
    <section class="section">
      <div class="section-header"><h2>Certification comparison</h2></div>
      <table class="data-table">
        <thead><tr><th>Certification</th><th>Level</th><th>Cost</th><th>Best for</th><th>Prerequisites</th></tr></thead>
        <tbody id="certTable"></tbody>
      </table>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script>
  <script src="site-data-extra.js"></script>
  <script src="site-data-v3.js"></script>
  <script src="site-data-secai.js"></script>
  <script src="app.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.getElementById("certTree").innerHTML = CERT_DECISION_TREE.map(c => `
      <div class="alert alert-info" style="margin-bottom:0.75rem">
        <strong>If:</strong> ${c.condition}<br><strong>Then:</strong> ${c.recommendation}
      </div>`).join("");
    document.getElementById("certTable").innerHTML = CERT_GUIDE.map(c => `
      <tr>
        <td>${c.link.startsWith("http") ? `<a href="${c.link}" target="_blank" rel="noopener">${c.cert} ↗</a>` : `<a href="${c.link}">${c.cert}</a>`}</td>
        <td>${c.level}</td>
        <td>${c.cost}</td>
        <td>${c.bestFor}</td>
        <td>${c.prereqs}</td>
      </tr>`).join("");
  </script>
</body>
</html>
