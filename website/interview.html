<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Prep — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner">
      <p class="kicker">Job preparation</p>
      <h1>Interview prep</h1>
      <p class="lead">Common AI security interview questions with outline answers. Expand each to study.</p>
    </div>
  </header>
  <main id="main">
    <section class="section">
      <div class="alert alert-info">Practice answering out loud. Map every answer to OWASP LLM Top 10 or MITRE ATLAS where possible.</div>
      <div id="interviewList"></div>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script>
  <script src="site-data-extra.js"></script>
  <script src="app.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.getElementById("interviewList").innerHTML = INTERVIEW_QUESTIONS.map((q, i) => `
      <details class="faq-item interview-item">
        <summary>${i + 1}. ${q.q}</summary>
        <div class="interview-outline">${q.outline}</div>
      </details>`).join("");
  </script>
</body>
</html>
