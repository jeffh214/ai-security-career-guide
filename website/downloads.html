<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner">
      <p class="kicker">Offline study</p>
      <h1>Download center</h1>
      <p class="lead">Full career guide, printable checklists, OWASP reference, résumé template, and progress export.</p>
    </div>
  </header>
  <main id="main">
    <section class="section">
      <div class="download-grid" id="downloadGrid"></div>
    </section>
    <section class="section bookmarks-panel">
      <div class="section-header"><h2>Your saved bookmarks</h2></div>
      <div id="bookmarksList"><p style="color:var(--text-muted)">No bookmarks yet. Save resources from the Resources page.</p></div>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script>
  <script src="site-data-extra.js"></script>
  <script src="site-data-v3.js"></script>
  <script src="site-data-secai.js"></script>
  <script src="app.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.getElementById("downloadGrid").innerHTML = DOWNLOADS.map(d => {
      if (d.type === "generated") {
        return `<div class="download-card"><h3>${d.label}</h3><button class="btn btn-primary" data-dl="${d.id}" type="button">Download</button></div>`;
      }
      if (d.type === "json") {
        return `<div class="download-card"><h3>${d.label}</h3><a class="btn btn-primary" href="${d.file}" target="_blank" rel="noopener">Open JSON ↗</a></div>`;
      }
      return `<div class="download-card"><h3>${d.label}</h3><a class="btn btn-primary" href="${d.file}" download>${(d.type || "file").toUpperCase()} ↓</a></div>`;
    }).join("");

    document.querySelectorAll("[data-dl]").forEach(btn => {
      btn.addEventListener("click", () => SiteUI.handleGeneratedDownload(btn.dataset.dl));
    });

    function renderBookmarks() {
      const list = SiteUI.getBookmarks();
      const el = document.getElementById("bookmarksList");
      if (!list.length) {
        el.innerHTML = '<p style="color:var(--text-muted)">No bookmarks yet. Save resources from the Resources page.</p>';
        return;
      }
      el.innerHTML = list.map(b => `
        <div class="bookmark-item">
          <a href="${b.url}" target="_blank" rel="noopener">${b.label}</a>
          <button class="bookmark-btn bookmarked" data-bookmark-url="${b.url}" data-bookmark-label="${b.label.replace(/"/g, "&quot;")}" type="button">Remove</button>
        </div>`).join("");
    }
    renderBookmarks();
  </script>
</body>
</html>
