<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Projects — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner">
      <p class="kicker">Build your portfolio</p>
      <h1>Portfolio project walkthroughs</h1>
      <p class="lead">Step-by-step guides for projects that stand out on your résumé and in interviews.</p>
    </div>
  </header>
  <main id="main">
    <section class="section" id="projectsList"></section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script>
  <script src="site-data-extra.js"></script>
  <script src="app.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.getElementById("projectsList").innerHTML = PROJECT_WALKTHROUGHS.map(p => `
      <article class="glossary-item" style="margin-bottom:1.5rem">
        <div class="case-meta">
          <span class="tag">${p.difficulty}</span>
          <span class="tag">${p.time}</span>
        </div>
        <h3>${p.title}</h3>
        <p><strong>Tools:</strong> ${p.tools.join(", ")}</p>
        <ol class="project-steps">${p.steps.map(s => `<li>${s}</li>`).join("")}</ol>
      </article>`).join("");
  </script>
</body>
</html>
