<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner"><p class="kicker">Job search</p><h1>Job board links</h1>
    <p class="lead">Curated search URLs for AI security roles — opens LinkedIn, Indeed, Glassdoor with pre-filled queries.</p></div>

  <main id="main">

      <div class="alert alert-info"><strong>Tips:</strong><ul class="phase-concepts" id="jobTips"></ul></div>

  <footer class="site-footer"></footer>

  <script>
    document.getElementById("jobTips").innerHTML = JOB_TIPS.map(t => `<li>${t}</li>`).join("");
    document.getElementById("jobLinks").innerHTML = JOB_SEARCHES.map(j => `
      <div class="resource-item"><a href="${j.url}" target="_blank" rel="noopener">${j.title} ↗</a>
      <div class="tag-list">${j.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></div>`).join("");
