<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner"><p class="kicker">Community</p><h1>Submit a case study</h1>
    <p class="lead">Add your own writeup — saved locally on this device for your portfolio notes.</p></div>
  </header>
  <main id="main">
    <form id="submitForm" class="alert alert-info" style="display:grid;gap:0.75rem;max-width:520px">
      <label>Title <input name="title" required style="width:100%;padding:0.5rem;margin-top:0.25rem" /></label>
      <label>Summary <textarea name="summary" rows="4" required style="width:100%;padding:0.5rem;margin-top:0.25rem"></textarea></label>
      <button class="btn btn-primary" type="submit">Save locally</button>
    </form>
    <section class="section"><h2>Your submissions</h2>
      <button class="btn btn-secondary" id="exportSubs" type="button" style="margin-bottom:1rem">Export submissions JSON</button>
      <div id="submitList"></div></section>
  </main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script><script src="site-data-extra.js"></script><script src="site-data-v3.js"></script><script src="site-data-v4.js"></script><script src="site-data-v5.js"></script><script src="app.js"></script><script src="features.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => {
    AcademyFeatures.initSubmit("submitForm", "submitList");
    document.getElementById("exportSubs").addEventListener("click", () => AcademyV2.exportSubmissions());
  });</script>
</body>
</html>
