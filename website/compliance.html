<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Track — AI Security Career Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" id="siteNav"></nav>
  <header class="hero" style="padding:3rem 1.5rem 3.5rem">
    <div class="hero-inner"><p class="kicker">Governance lane</p><h1>AI compliance &amp; risk frameworks</h1>
    <p class="lead">NIST AI RMF, ISO 42001, EU AI Act, Google SAIF, and OWASP GenAI — how they connect to AI security careers.</p></div>
  </header>
  <main id="main"><section class="section" id="complianceList"></section></main>
  <footer class="site-footer"></footer>
  <script src="site-data.js"></script><script src="site-data-extra.js"></script><script src="site-data-v3.js"></script><script src="site-data-v4.js"></script><script src="site-data-v5.js"></script><script src="app.js"></script><script src="features.js"></script><script src="features-v2.js"></script><script src="features-v3.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("complianceList").innerHTML = COMPLIANCE_TRACK.map((c) => `
        <article class="card" style="margin-bottom:1.25rem">
          <h2><a href="${c.url}" target="_blank" rel="noopener">${c.framework} ↗</a></h2>
          <p>${c.summary}</p>
          <div class="tag-list">${c.phases.map((p) => `<span class="tag">${p}</span>`).join("")}</div>
          <p style="margin-top:0.75rem"><strong>AI security relevance:</strong> ${c.aiSecRelevance}</p>
        </article>`).join("");
    });
  </script>
</body>
</html>
