<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <script>
    document.getElementById("mentorCheck").innerHTML = MENTOR_GUIDE.checklist.map(c => `<li>${c}</li>`).join("");
    document.getElementById("mentorDiscord").innerHTML = (MENTOR_GUIDE.discordLinks || []).map(l =>
      `<div class="resource-item"><a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a></div>`).join("");
